services:
  backend:
    build: .
    image: mamma-mia-vis-backend
    ports:
      - "8040:8040"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    # Overriding the command to use --reload for development if needed, 
    # but the Dockerfile CMD is good for production-like local run.
    # command: uvicorn main:app --host 0.0.0.0 --port 8040 --reload
